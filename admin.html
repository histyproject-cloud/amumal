<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>아무말 - 관리자</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Space+Mono:wght@700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#0f0f0f; --bg2:#171717; --bg3:#1f1f1f;
    --border:#2a2a2a; --border2:#333;
    --text:#e8e8e8; --text2:#888; --text3:#555;
    --accent:#ff4444; --green:#22c55e; --blue:#3b82f6; --yellow:#fbbf24; --purple:#a855f7;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--text); font-family:'Noto Sans KR',sans-serif; font-size:14px; min-height:100vh; }

  /* 로그인 */
  .login-screen { display:flex; align-items:center; justify-content:center; min-height:100vh; }
  .login-box { background:var(--bg2); border:1px solid var(--border2); border-radius:16px; padding:32px; width:320px; }
  .login-box h2 { font-family:'Space Mono',monospace; color:var(--accent); margin-bottom:20px; font-size:18px; }
  .login-input { width:100%; background:var(--bg3); border:1px solid var(--border2); color:var(--text); font-size:14px; padding:10px 14px; border-radius:8px; outline:none; margin-bottom:10px; font-family:'Noto Sans KR',sans-serif; }
  .login-input:focus { border-color:var(--accent); }
  .login-btn { width:100%; background:var(--accent); color:white; border:none; font-size:14px; font-weight:700; padding:11px; border-radius:8px; cursor:pointer; font-family:'Noto Sans KR',sans-serif; margin-top:4px; }
  .login-error { color:var(--accent); font-size:12px; margin-top:8px; display:none; }

  /* 메인 레이아웃 */
  .admin-wrap { display:none; }
  .admin-header { background:var(--bg2); border-bottom:1px solid var(--border); padding:0 20px; position:sticky; top:0; z-index:100; }
  .admin-header-inner { max-width:1100px; margin:0 auto; display:flex; align-items:center; justify-content:space-between; height:52px; }
  .admin-logo { font-family:'Space Mono',monospace; font-size:16px; font-weight:700; color:var(--accent); }
  .admin-logo span { color:var(--text2); font-size:11px; font-weight:400; margin-left:8px; }
  .logout-btn { background:none; border:1px solid var(--border2); color:var(--text2); font-size:12px; padding:5px 12px; border-radius:6px; cursor:pointer; font-family:'Noto Sans KR',sans-serif; }
  .logout-btn:hover { border-color:var(--accent); color:var(--accent); }

  .admin-body { max-width:1100px; margin:0 auto; padding:20px; }

  /* 탭 */
  .admin-tabs { display:flex; gap:4px; margin-bottom:20px; border-bottom:1px solid var(--border); }
  .admin-tab { background:none; border:none; color:var(--text2); font-size:13px; font-weight:500; padding:10px 18px; cursor:pointer; border-bottom:2px solid transparent; margin-bottom:-1px; font-family:'Noto Sans KR',sans-serif; transition:all .15s; }
  .admin-tab.active { color:var(--text); border-bottom-color:var(--accent); }

  .tab-content { display:none; }
  .tab-content.active { display:block; }

  /* 통계 카드 */
  .stats-grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(180px,1fr)); gap:12px; margin-bottom:24px; }
  .stat-card { background:var(--bg2); border:1px solid var(--border); border-radius:10px; padding:16px; }
  .stat-card-label { font-size:11px; color:var(--text2); margin-bottom:6px; }
  .stat-card-value { font-size:28px; font-weight:700; font-family:'Space Mono',monospace; }
  .stat-card-value.accent { color:var(--accent); }
  .stat-card-value.green { color:var(--green); }
  .stat-card-value.blue { color:var(--blue); }
  .stat-card-value.yellow { color:var(--yellow); }

  /* 차트 영역 */
  .chart-box { background:var(--bg2); border:1px solid var(--border); border-radius:10px; padding:16px; margin-bottom:16px; }
  .chart-title { font-size:13px; color:var(--text2); margin-bottom:12px; }
  .bar-chart { display:flex; align-items:flex-end; gap:6px; height:80px; }
  .bar-item { flex:1; display:flex; flex-direction:column; align-items:center; gap:4px; }
  .bar-fill { width:100%; background:var(--accent); border-radius:3px 3px 0 0; min-height:2px; transition:height .3s; opacity:.8; }
  .bar-label { font-size:9px; color:var(--text3); }
  .bar-val { font-size:9px; color:var(--text2); }

  /* 테이블 */
  .section-title { font-size:14px; font-weight:700; margin-bottom:12px; display:flex; align-items:center; gap:8px; }
  .section-title .count-badge { background:var(--accent); color:white; font-size:10px; padding:2px 7px; border-radius:10px; }
  .admin-table { width:100%; border-collapse:collapse; }
  .admin-table th { background:var(--bg3); color:var(--text2); font-size:11px; font-weight:500; padding:8px 12px; text-align:left; border-bottom:1px solid var(--border); }
  .admin-table td { padding:10px 12px; border-bottom:1px solid var(--border); font-size:13px; vertical-align:middle; }
  .admin-table tr:hover td { background:var(--bg3); }
  .admin-table .content-cell { max-width:300px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  /* 버튼들 */
  .btn-delete { background:none; border:1px solid var(--accent); color:var(--accent); font-size:11px; padding:4px 10px; border-radius:5px; cursor:pointer; font-family:'Noto Sans KR',sans-serif; transition:all .15s; }
  .btn-delete:hover { background:var(--accent); color:white; }
  .btn-restore { background:none; border:1px solid var(--green); color:var(--green); font-size:11px; padding:4px 10px; border-radius:5px; cursor:pointer; font-family:'Noto Sans KR',sans-serif; }
  .btn-restore:hover { background:var(--green); color:white; }
  .btn-primary { background:var(--blue); color:white; border:none; font-size:12px; font-weight:600; padding:7px 14px; border-radius:7px; cursor:pointer; font-family:'Noto Sans KR',sans-serif; }
  .btn-danger { background:var(--accent); color:white; border:none; font-size:12px; font-weight:600; padding:7px 14px; border-radius:7px; cursor:pointer; font-family:'Noto Sans KR',sans-serif; }

  /* 신고 배지 */
  .report-badge { background:#2a1a1a; color:var(--accent); font-size:10px; padding:2px 6px; border-radius:4px; font-weight:700; }
  .hidden-badge { background:#1a1a2a; color:#818cf8; font-size:10px; padding:2px 6px; border-radius:4px; }

  /* 금칙어 */
  .banned-list { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:16px; }
  .banned-word { background:var(--bg3); border:1px solid var(--border2); color:var(--text); font-size:12px; padding:4px 10px; border-radius:20px; display:flex; align-items:center; gap:6px; }
  .banned-word-del { background:none; border:none; color:var(--text3); cursor:pointer; font-size:12px; line-height:1; padding:0; }
  .banned-word-del:hover { color:var(--accent); }
  .add-banned-row { display:flex; gap:8px; margin-top:8px; }
  .banned-input { flex:1; background:var(--bg3); border:1px solid var(--border2); color:var(--text); font-size:13px; padding:8px 12px; border-radius:8px; outline:none; font-family:'Noto Sans KR',sans-serif; max-width:300px; }
  .banned-input:focus { border-color:var(--blue); }

  /* 로딩 */
  .loading { text-align:center; padding:40px; color:var(--text3); font-size:13px; }
  .empty-row td { text-align:center; color:var(--text3); padding:30px; }

  /* 토스트 */
  .toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(20px); background:var(--bg3); border:1px solid var(--border2); color:var(--text); font-size:13px; padding:10px 18px; border-radius:20px; opacity:0; pointer-events:none; transition:all .25s; z-index:999; white-space:nowrap; }
  .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

  /* 필터 */
  .filter-row { display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap; align-items:center; }
  .filter-select { background:var(--bg3); border:1px solid var(--border2); color:var(--text2); font-size:12px; padding:5px 10px; border-radius:6px; outline:none; font-family:'Noto Sans KR',sans-serif; }
  .refresh-btn { background:none; border:1px solid var(--border2); color:var(--text2); font-size:12px; padding:5px 12px; border-radius:6px; cursor:pointer; font-family:'Noto Sans KR',sans-serif; }
  .refresh-btn:hover { border-color:var(--blue); color:var(--blue); }
</style>
</head>
<body>

<!-- 로그인 -->
<div class="login-screen" id="loginScreen">
  <div class="login-box">
    <h2>🔐 관리자 로그인</h2>
    <input class="login-input" id="adminPw" type="password" placeholder="관리자 비밀번호"
      onkeydown="if(event.key==='Enter') doLogin()">
    <button class="login-btn" onclick="doLogin()">로그인</button>
    <div class="login-error" id="loginError">비밀번호가 틀렸어요</div>
  </div>
</div>

<!-- 관리자 패널 -->
<div class="admin-wrap" id="adminWrap">
  <div class="admin-header">
    <div class="admin-header-inner">
      <div class="admin-logo">아무말<span>관리자 패널</span></div>
      <button class="logout-btn" onclick="doLogout()">로그아웃</button>
    </div>
  </div>

  <div class="admin-body">
    <div class="admin-tabs">
      <button class="admin-tab active" onclick="switchAdminTab('stats', this)">📊 통계</button>
      <button class="admin-tab" onclick="switchAdminTab('reports', this)">🚨 신고</button>
      <button class="admin-tab" onclick="switchAdminTab('posts', this)">📝 게시글</button>
      <button class="admin-tab" onclick="switchAdminTab('banned', this)">🚫 금칙어</button>
    </div>

    <!-- 통계 탭 -->
    <div class="tab-content active" id="tab-stats">
      <div class="stats-grid" id="statsGrid">
        <div class="stat-card"><div class="stat-card-label">전체 게시글</div><div class="stat-card-value accent" id="stat-posts">-</div></div>
        <div class="stat-card"><div class="stat-card-label">전체 댓글</div><div class="stat-card-value blue" id="stat-comments">-</div></div>
        <div class="stat-card"><div class="stat-card-label">신고 접수</div><div class="stat-card-value yellow" id="stat-reports">-</div></div>
        <div class="stat-card"><div class="stat-card-label">숨김 처리된 글</div><div class="stat-card-value" id="stat-hidden">-</div></div>
        <div class="stat-card"><div class="stat-card-label">오늘 게시글</div><div class="stat-card-value green" id="stat-today">-</div></div>
        <div class="stat-card"><div class="stat-card-label">총 공감 수</div><div class="stat-card-value" style="color:var(--purple)" id="stat-ups">-</div></div>
      </div>
      <div class="chart-box">
        <div class="chart-title">최근 7일 게시글 수</div>
        <div class="bar-chart" id="barChart"></div>
      </div>
    </div>

    <!-- 신고 탭 -->
    <div class="tab-content" id="tab-reports">
      <div class="filter-row">
        <select class="filter-select" id="reportTypeFilter" onchange="loadReports()">
          <option value="">전체</option>
          <option value="post">게시글</option>
          <option value="comment">댓글</option>
        </select>
        <button class="refresh-btn" onclick="loadReports()">🔄 새로고침</button>
      </div>
      <div class="section-title">신고 목록 <span class="count-badge" id="reportCount">0</span></div>
      <div id="reportsList"><div class="loading">불러오는 중...</div></div>
    </div>

    <!-- 게시글 탭 -->
    <div class="tab-content" id="tab-posts">
      <div class="filter-row">
        <select class="filter-select" id="postStatusFilter" onchange="loadAllPosts()">
          <option value="">전체</option>
          <option value="hidden">숨김 글만</option>
          <option value="reported">신고 있는 글</option>
        </select>
        <button class="refresh-btn" onclick="loadAllPosts()">🔄 새로고침</button>
      </div>
      <div class="section-title">게시글 목록 <span class="count-badge" id="postsCount">0</span></div>
      <div id="postsList"><div class="loading">불러오는 중...</div></div>
    </div>

    <!-- 금칙어 탭 -->
    <div class="tab-content" id="tab-banned">
      <div class="section-title">금칙어 목록</div>
      <div class="banned-list" id="bannedList"></div>
      <div class="add-banned-row">
        <input class="banned-input" id="bannedInput" placeholder="추가할 금칙어 입력..."
          onkeydown="if(event.key==='Enter') addBannedWord()">
        <button class="btn-primary" onclick="addBannedWord()">추가</button>
      </div>
      <div style="margin-top:16px; padding-top:16px; border-top:1px solid var(--border);">
        <div style="font-size:12px; color:var(--text2); margin-bottom:8px;">💡 금칙어는 브라우저에 저장돼요. 여러 기기에서 관리하려면 Supabase에 테이블을 만드는 걸 추천해요.</div>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ── 설정 ──
const SUPABASE_URL = 'https://oathqvxogecbrpswnjxk.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9hdGhxdnhvZ2VjYnJwc3duanhrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzMwNTA5NDYsImV4cCI6MjA4ODYyNjk0Nn0.zrieOYKfxDB4r_czc8dz-bA33Yr_LR7BdWqWA_SZQb8';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// ── 관리자 비밀번호 (여기서 변경!) ──
const ADMIN_PASSWORD = 'admin1234';

// ── 로그인 ──
function doLogin() {
  const pw = document.getElementById('adminPw').value;
  if (pw === ADMIN_PASSWORD) {
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('adminWrap').style.display = 'block';
    loadStats();
  } else {
    document.getElementById('loginError').style.display = 'block';
  }
}
function doLogout() {
  document.getElementById('loginScreen').style.display = 'flex';
  document.getElementById('adminWrap').style.display = 'none';
  document.getElementById('adminPw').value = '';
}

// ── 탭 전환 ──
function switchAdminTab(tab, el) {
  document.querySelectorAll('.admin-tab').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
  document.getElementById(`tab-${tab}`).classList.add('active');
  if (tab === 'stats') loadStats();
  if (tab === 'reports') loadReports();
  if (tab === 'posts') loadAllPosts();
  if (tab === 'banned') loadBannedWords();
}

// ══════════════════════════════
// 통계
// ══════════════════════════════
async function loadStats() {
  try {
    const [postsRes, commentsRes, reportsRes] = await Promise.all([
      sb.from('posts').select('id, hidden, up, created_at', { count: 'exact' }),
      sb.from('comments').select('id', { count: 'exact' }),
      sb.from('reports').select('id', { count: 'exact' })
    ]);

    const posts = postsRes.data || [];
    const today = new Date(); today.setHours(0,0,0,0);
    const todayPosts = posts.filter(p => new Date(p.created_at) >= today).length;
    const hiddenPosts = posts.filter(p => p.hidden).length;
    const totalUps = posts.reduce((sum, p) => sum + (p.up||0), 0);

    document.getElementById('stat-posts').textContent = posts.length;
    document.getElementById('stat-comments').textContent = commentsRes.count || 0;
    document.getElementById('stat-reports').textContent = reportsRes.count || 0;
    document.getElementById('stat-hidden').textContent = hiddenPosts;
    document.getElementById('stat-today').textContent = todayPosts;
    document.getElementById('stat-ups').textContent = totalUps;

    // 7일 차트
    renderBarChart(posts);
  } catch(e) { showToast('통계 로딩 실패'); }
}

function renderBarChart(posts) {
  const days = [];
  for (let i = 6; i >= 0; i--) {
    const d = new Date(); d.setDate(d.getDate()-i); d.setHours(0,0,0,0);
    const next = new Date(d); next.setDate(d.getDate()+1);
    const count = posts.filter(p => { const t = new Date(p.created_at); return t >= d && t < next; }).length;
    days.push({ label: `${d.getMonth()+1}/${d.getDate()}`, count });
  }
  const max = Math.max(...days.map(d => d.count), 1);
  document.getElementById('barChart').innerHTML = days.map(d => `
    <div class="bar-item">
      <div class="bar-val">${d.count}</div>
      <div class="bar-fill" style="height:${Math.max(4, (d.count/max)*60)}px"></div>
      <div class="bar-label">${d.label}</div>
    </div>`).join('');
}

// ══════════════════════════════
// 신고 목록
// ══════════════════════════════
async function loadReports() {
  document.getElementById('reportsList').innerHTML = '<div class="loading">불러오는 중...</div>';
  try {
    let query = sb.from('reports').select('*').order('created_at', { ascending: false }).limit(100);
    const typeFilter = document.getElementById('reportTypeFilter').value;
    if (typeFilter) query = query.eq('target_type', typeFilter);
    const { data, error } = await query;
    if (error) throw error;
    document.getElementById('reportCount').textContent = (data||[]).length;
    if (!data || !data.length) {
      document.getElementById('reportsList').innerHTML = '<table class="admin-table"><tr class="empty-row"><td colspan="5">신고가 없어요</td></tr></table>'; return;
    }
    document.getElementById('reportsList').innerHTML = `
      <table class="admin-table">
        <thead><tr>
          <th>유형</th><th>대상 ID</th><th>사유</th><th>시간</th><th>처리</th>
        </tr></thead>
        <tbody>${data.map(r => `
          <tr>
            <td><span class="report-badge">${r.target_type === 'post' ? '게시글' : '댓글'}</span></td>
            <td style="color:var(--text2)">#${r.target_id}</td>
            <td>${escHtml(r.reason||'-')}</td>
            <td style="color:var(--text3)">${timeAgo(r.created_at)}</td>
            <td>
              ${r.target_type === 'post' ? `
                <button class="btn-delete" onclick="deletePost(${r.target_id})">글 삭제</button>
                <button class="btn-restore" onclick="restorePost(${r.target_id})" style="margin-left:4px">숨김 해제</button>
              ` : `
                <button class="btn-delete" onclick="deleteComment(${r.target_id})">댓글 삭제</button>
              `}
            </td>
          </tr>`).join('')}
        </tbody>
      </table>`;
  } catch(e) { document.getElementById('reportsList').innerHTML = `<div class="loading">오류: ${e.message}</div>`; }
}

// ══════════════════════════════
// 게시글 관리
// ══════════════════════════════
async function loadAllPosts() {
  document.getElementById('postsList').innerHTML = '<div class="loading">불러오는 중...</div>';
  try {
    let query = sb.from('posts').select('*').order('created_at', { ascending: false }).limit(100);
    const filter = document.getElementById('postStatusFilter').value;
    if (filter === 'hidden') query = query.eq('hidden', true);
    if (filter === 'reported') query = query.gt('report_count', 0);
    const { data, error } = await query;
    if (error) throw error;
    document.getElementById('postsCount').textContent = (data||[]).length;
    if (!data || !data.length) {
      document.getElementById('postsList').innerHTML = '<table class="admin-table"><tr class="empty-row"><td colspan="6">게시글이 없어요</td></tr></table>'; return;
    }
    document.getElementById('postsList').innerHTML = `
      <table class="admin-table">
        <thead><tr>
          <th>태그</th><th>내용</th><th>공감</th><th>신고</th><th>시간</th><th>관리</th>
        </tr></thead>
        <tbody>${data.map(p => `
          <tr>
            <td><span class="tag-badge" style="font-size:10px;padding:2px 6px;border-radius:10px;background:var(--bg3);color:var(--text2)">${p.tag}</span></td>
            <td class="content-cell">${escHtml(p.content||'')} ${p.hidden ? '<span class="hidden-badge">숨김</span>' : ''}</td>
            <td style="color:var(--accent)">👍 ${p.up||0}</td>
            <td>${p.report_count > 0 ? `<span class="report-badge">${p.report_count}건</span>` : '-'}</td>
            <td style="color:var(--text3)">${timeAgo(p.created_at)}</td>
            <td style="display:flex;gap:4px;flex-wrap:wrap">
              <button class="btn-delete" onclick="deletePost(${p.id})">삭제</button>
              ${p.hidden ? `<button class="btn-restore" onclick="restorePost(${p.id})">복원</button>` : `<button class="btn-restore" onclick="hidePost(${p.id})">숨김</button>`}
            </td>
          </tr>`).join('')}
        </tbody>
      </table>`;
  } catch(e) { document.getElementById('postsList').innerHTML = `<div class="loading">오류: ${e.message}</div>`; }
}

async function deletePost(id) {
  if (!confirm(`#${id} 게시글을 삭제할까요? 댓글도 모두 삭제됩니다.`)) return;
  const { error } = await sb.from('posts').delete().eq('id', id);
  if (error) { showToast('삭제 실패: '+error.message); return; }
  showToast('게시글이 삭제됐어요');
  loadAllPosts(); loadReports();
}

async function hidePost(id) {
  await sb.from('posts').update({ hidden: true }).eq('id', id);
  showToast('숨김 처리됐어요'); loadAllPosts();
}

async function restorePost(id) {
  await sb.from('posts').update({ hidden: false, report_count: 0 }).eq('id', id);
  showToast('복원됐어요'); loadAllPosts();
}

async function deleteComment(id) {
  if (!confirm(`댓글 #${id}을 삭제할까요?`)) return;
  const { error } = await sb.from('comments').delete().eq('id', id);
  if (error) { showToast('삭제 실패'); return; }
  showToast('댓글이 삭제됐어요'); loadReports();
}

// ══════════════════════════════
// 금칙어
// ══════════════════════════════
function loadBannedWords() {
  const words = getBannedWords();
  document.getElementById('bannedList').innerHTML = words.length
    ? words.map((w,i) => `
        <div class="banned-word">
          ${escHtml(w)}
          <button class="banned-word-del" onclick="removeBannedWord(${i})">✕</button>
        </div>`).join('')
    : '<span style="color:var(--text3);font-size:12px">등록된 금칙어가 없어요</span>';
}

function getBannedWords() {
  try { return JSON.parse(localStorage.getItem('amuBannedWords') || '[]'); } catch{ return []; }
}

function saveBannedWords(words) {
  localStorage.setItem('amuBannedWords', JSON.stringify(words));
}

function addBannedWord() {
  const input = document.getElementById('bannedInput');
  const word = input.value.trim();
  if (!word) return;
  const words = getBannedWords();
  if (words.includes(word)) { showToast('이미 있는 금칙어예요'); return; }
  words.push(word);
  saveBannedWords(words);
  input.value = '';
  loadBannedWords();
  showToast(`"${word}" 금칙어 추가됐어요`);
}

function removeBannedWord(i) {
  const words = getBannedWords();
  const removed = words[i];
  words.splice(i,1);
  saveBannedWords(words);
  loadBannedWords();
  showToast(`"${removed}" 삭제됐어요`);
}

// ── 유틸 ──
let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2500);
}
function escHtml(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function timeAgo(ts) {
  const d = Date.now() - new Date(ts).getTime();
  if (d < 60000) return '방금';
  if (d < 3600000) return `${Math.floor(d/60000)}분 전`;
  if (d < 86400000) return `${Math.floor(d/3600000)}시간 전`;
  return `${Math.floor(d/86400000)}일 전`;
}

document.getElementById('adminPw').addEventListener('keydown', e => {
  if (e.key === 'Enter') doLogin();
});
